[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pace-asd"
version = "1.2.0"
description = "PACE-ASD: cross-validated modeling of whole-body movement in short videos, with controls for recording artifacts"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["pose estimation", "gait", "movement", "cross-validation", "transformer", "autism research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "src", "scripts", "models", "processed", "results", "splits", "reports", "ISWA*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
