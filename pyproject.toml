[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pace-asd"
version = "1.0.0"
description = "PACE-ASD: Pose-Aware Contiguous Event Saliency-Gated Transformer for Markerless ASD Screening Research"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["autism", "ASD", "pose-estimation", "transformer", "deep-learning", "screening"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "src", "scripts", "models", "processed", "results", "splits", "reports", "ISWA*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
