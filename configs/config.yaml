# PACE-ASD — reference configuration.
# Every setting below was fixed before the cross-validation reported in the
# accompanying article was run; none was tuned on its results.
data:
  raw_dir: null            # set with --raw_dir or PACE_ASD_RAW_DIR
  processed_dir: processed
  fps: 60                  # frame rate of the source videos (PREPROCESS_SPEC.md)
  max_frames: 300
  num_landmarks: 33
  max_abs_coord: 10.0      # frames with a normalised coordinate beyond this are treated as undetected
  align_onset: true        # first detected frame moved to frame 0 before modelling

model:
  spatial_dim: 128
  conv1d_channels: 32
  dropout: 0.4
  event_block_size: 15     # L, frames per block
  event_top_m: 8           # M, blocks passed to the Transformer
  transformer_heads: 4
  transformer_layers: 1
  mask_padding: true       # validity mask through normalisation, gate, attention and pooling
  align_onset: true        # positions counted from the first detected frame

training:
  optimizer: adamw
  lr: 0.00005
  weight_decay: 0.03
  batch_size: 8
  epochs: 80
  early_stopping_patience: 15
  clips_per_subject: 4     # draws per child per epoch, each independently augmented
  selection: composite     # composite | val_loss
  num_workers: 0
  seed: 42
  # used only by the fixed-split training entry point (src/train.py)
  n_folds: 3
  n_seeds: 20
  test_split_ratio: 0.25

calibration:
  lr: 0.01
  max_iter: 100

cv:
  partition_file: splits/cv_partition.json
  seed: 20261008
  n_outer: 5
  n_inner: 3
  n_repeats: 3
  max_repeats: 10

output:
  models_dir: models
  reports_dir: reports
  results_dir: results
  splits_file: splits/splits_dryad_v2_dedup.json
  cv_dir: results/cv
  cv_models_dir: models/cv
