data:
  raw_dir: "D:/dryad"
  processed_dir: processed
  fps: 30
  max_frames: 300
  num_landmarks: 33

model:
  spatial_dim: 128
  conv1d_channels: 32
  dropout: 0.4
  event_block_size: 15
  event_top_m: 8
  transformer_heads: 4
  transformer_layers: 1

training:
  optimizer: adamw
  n_folds: 3
  n_seeds: 20
  test_split_ratio: 0.25
  batch_size: 16
  epochs: 60
  lr: 0.0002
  weight_decay: 0.015
  early_stopping_patience: 10
  clips_per_subject: 4
  num_workers: 0
  seed: 42

calibration:
  lr: 0.01
  max_iter: 100

output:
  models_dir: models
  reports_dir: reports
  results_dir: results
  splits_file: splits/splits_dryad_only_v1.json
