data:
  raw_dir: "D:/dryad"
  processed_dir: processed
  fps: 30
  max_frames: 300
  num_landmarks: 33

model:
  spatial_dim: 128
  conv1d_channels: 32
  dropout: 0.4
  event_block_size: 15
  event_top_m: 8
  transformer_heads: 4
  transformer_layers: 1

training:
  optimizer: adamw
  n_folds: 3
  n_seeds: 20
  test_split_ratio: 0.25
  batch_size: 8          # was 16 — ~3 steps/epoch → now ~6 steps/epoch with n≈44 train
  epochs: 80             # was 60 — more room since early stopping will still cut short
  lr: 0.00005            # was 0.0002 — smaller cohort needs smaller LR
  weight_decay: 0.03     # was 0.015 — more regularization for n=44
  early_stopping_patience: 15  # was 10 — val is noisy at n=23, give more time
  clips_per_subject: 4
  num_workers: 0
  seed: 42

calibration:
  lr: 0.01
  max_iter: 100

output:
  models_dir: models
  reports_dir: reports
  results_dir: results
  splits_file: splits/splits_dryad_v2_dedup.json
