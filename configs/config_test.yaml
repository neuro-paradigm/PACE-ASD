data:
  raw_dir: "data/raw"
  processed_dir: "processed"
  fps: 30
  max_frames: 300
  num_landmarks: 33
  smoothing_window: 7
  smoothing_polyorder: 3

model:
  spatial_dim: 256
  conv1d_channels: 128
  top_k: 128
  transformer_heads: 4
  transformer_layers: 2
  dropout: 0.4

training:
  epochs: 2
  batch_size: 16
  lr: 0.0002
  weight_decay: 0.05
  early_stopping_patience: 15
  n_folds: 2
  clips_per_subject: 5
  combined_score_weights:
    loss: 0.4
    sensitivity: 0.3
    specificity: 0.3
  num_workers: 0
  seed: 42
  test_split_ratio: 0.25

calibration:
  n_bins: 10
  lr: 0.01
  max_iter: 50

output:
  models_dir: "models_test"
  reports_dir: "reports_test"
